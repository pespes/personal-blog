overrides:
  # Keep a single zod on the line Astro 7 bundles (astro 7.3 needs
  # ^4.5.4). Without this, @astrojs/rss and @astrojs/sitemap resolve a
  # second copy at 4.3.6.
  zod: ^4.5.4
  # @keystatic/core 0.6.9 needs @keystar/ui ~0.10.0, but pnpm keeps
  # resolving the 0.7.21 that 0.5.x used. Pin it explicitly.
  "@keystar/ui": 0.10.0

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
